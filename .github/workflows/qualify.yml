name: Qualify headless engine
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  qualify:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-14
            target: aarch64-apple-darwin
          - runner: macos-15-intel
            target: x86_64-apple-darwin
          - runner: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python3 scripts/mega_build.py --output .build/qualified/runtime --archive .build/qualified/engine.tar.gz
      - run: python3 scripts/mega_smoke.py .build/qualified/runtime/mega
      - run: python3 scripts/audit_runtime.py .build/qualified/runtime --target '${{ matrix.target }}'
      - run: python3 -m unittest discover -s scripts/tests -p 'test_mega*.py'
      - uses: actions/upload-artifact@v4
        with:
          name: engine-${{ matrix.target }}
          path: .build/qualified/engine.tar.gz
          retention-days: 7
